{% extends "layout/basic.html" %}
{% block title %}Добавление объявления{% endblock %}
{% block content %}
<h1>{% if object %}
                        Изменение
                        {% else %}
                        Добавление
                        {% endif %} объявления</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-lg btn-block btn-outline-primary">
                        {% if object %}
                        Изменить
                        {% else %}
                        Создать
                        {% endif %}
</form>
{% endblock %}
